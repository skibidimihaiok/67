name: Inspect original 1.21.11 and ION source projects

on:
  push:
    branches: [ion-client-development]
    paths:
      - '.github/workflows/ion-base-source-inspection.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the two client sources with ION
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/original /tmp/template /tmp/ion
          unzip -q "suschunkfinder-1.21.11-source (4).zip" -d /tmp/original
          unzip -q "skbiditoilet-fixed (1).zip" -d /tmp/template
          unzip -q "ION-CLIENT-visuals-experimental.zip" -d /tmp/ion

          inspect_project() {
            label="$1"
            root="$2"
            echo "===== PROJECT: $label ====="
            echo "Root: $root"
            find "$root" -maxdepth 7 -type f | sort | head -240
            echo "--- Fabric metadata ---"
            find "$root" -name fabric.mod.json -print -exec cat {} \;
            echo "--- Build properties ---"
            find "$root" -maxdepth 4 \( -name build.gradle -o -name gradle.properties -o -name settings.gradle \) -print -exec sed -n '1,200p' {} \;
            echo "--- GUI, module registry, keybind and config sources ---"
            for f in ModuleManager.java ClickGuiModule.java ClickGuiScreen.java ModuleSettingsScreen.java ModuleKeybinds.java Keys.java ConfigManager.java Config.java SusChunkFinderClient.java ClientModule.java; do
              while IFS= read -r file; do
                echo "##### $file #####"
                sed -n '1,260p' "$file"
              done < <(find "$root" -type f -name "$f" | sort)
            done
            echo "--- Keybind / GUI opening / registration markers ---"
            grep -RinE 'LEFT_SHIFT|RIGHT_SHIFT|GLFW_KEY_[A-Z0-9_]+|key\.consumeClick|isDown\(|ClickGuiScreen|openScreen|setScreen|MODULES\.add|register\(' "$root" --include='*.java' | head -500 || true
            echo "--- Module source inventory ---"
            find "$root" -type f -name '*Module.java' | sort
          }

          ORIGINAL="$(find /tmp/original -type f -name build.gradle -printf '%h\n' | head -1)"
          TEMPLATE="$(find /tmp/template -type f -name build.gradle -printf '%h\n' | head -1)"
          IONROOT="$(find /tmp/ion -type f -name build.gradle -printf '%h\n' | head -1)"
          test -n "$ORIGINAL" && test -n "$TEMPLATE" && test -n "$IONROOT"
          inspect_project "ORIGINAL SOURCE ARCHIVE" "$ORIGINAL"
          inspect_project "SKBIDITOILET TEMPLATE" "$TEMPLATE"
          inspect_project "ION SOURCE" "$IONROOT"

          echo "===== CHECKED-IN ION OVERRIDES ====="
          find ion-client-overrides/src/main/java -type f -name '*.java' | sort
          echo "===== USER EXCLUSIONS PRESENT IN ION SOURCE ====="
          find /tmp/ion ion-client-overrides/src/main/java -type f -name '*.java' | grep -Ei '(Mace|TriggerBot|KillAura|StorageEsp)' || true

      - uses: actions/upload-artifact@v4
        with:
          name: original-base-and-ion-source-inspection
          path: |
            /tmp/original
            /tmp/template
            /tmp/ion
          if-no-files-found: error
