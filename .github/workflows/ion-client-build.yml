name: Build ION CLIENT

on:
  push:
    paths:
      - 'ION-CLIENT-visuals-experimental.zip'
      - '.github/workflows/ion-client-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract ION CLIENT source
        run: |
          mkdir ion-client
          unzip -q ION-CLIENT-visuals-experimental.zip -d ion-client

      - name: Apply ION module overrides
        run: |
          cp -R ion-client-overrides/src/main/java/. ion-client/src/main/java/
          python3 - <<'PY'
          from pathlib import Path
          manager = Path("ion-client/src/main/java/com/suschunkfinder/ModuleManager.java")
          text = manager.read_text()
          marker = "\t\t// Macro"
          additions = "\t\tMODULES.add(new SprintModule());\n\t\tMODULES.add(new AutoJumpModule());\n\t\tMODULES.add(new NoFallModule());\n\t\tMODULES.add(new TriggerBotModule());\n\t\tMODULES.add(new AutoTotemModule());\n\t\tMODULES.add(new AuraModule());\n\t\tMODULES.add(new CriticalsModule());\n\t\tMODULES.add(new AutoArmorModule());\n\t\tMODULES.add(new OffhandModule());\n\t\tMODULES.add(new GapModule());\n\t\tMODULES.add(new AutoMaceModule());\n\t\tMODULES.add(new AutoPearlCatchModule());\n\t\tMODULES.add(new AutoPotionModule());\n\t\tMODULES.add(new AutoCrystalModule());\n\t\tMODULES.add(new SurroundModule());\n\t\tMODULES.add(new AutoWebTrapModule());\n\t\tMODULES.add(new AntiKnockbackModule());\n\t\tMODULES.add(new TrapModule());\n\t\tMODULES.add(new SurroundMinerModule());\n\t\tMODULES.add(new SelfTrapModule());\n\t\tMODULES.add(new ElytraTargetModule());\n\t\tMODULES.add(new ElytraMaceTargetModule());\n\t\tMODULES.add(new ElytraFreezeModule());\n\t\tMODULES.add(new AttributeSwapModule());\n\t\tMODULES.add(new AntiPhaseModule());\n\t\tMODULES.add(new PearlPredictModule());\n\t\tMODULES.add(new ProjectilePredictModule());\n\t\tMODULES.add(new TrajectoriesModule());\n\t\tMODULES.add(new AutoWitherModule());\n\t\tMODULES.add(new TotemModule());\n\t\tMODULES.add(new HighJumpModule());\n\t\tMODULES.add(new AirJumpModule());\n\t\tMODULES.add(new DolphinModule());\n\t\tMODULES.add(new SpeedModule());\n\t\tMODULES.add(new LongJumpModule());\n\t\tMODULES.add(new ParkourModule());\n\t\tMODULES.add(new StepModule());\n\t\tMODULES.add(new SpiderModule());\n\t\tMODULES.add(new ElytraBoostModule());\n\t\tMODULES.add(new LandingEffectsModule());\n\t\tMODULES.add(new OrbitParticlesModule());\n\t\tMODULES.add(new HaloModule());\n\t\tMODULES.add(new TargetTrailsModule());\n\t\tMODULES.add(new PlayerTrailsModule());\n\t\tMODULES.add(new CriticalParticlesModule());\n\t\tMODULES.add(new AmbientParticlesModule());\n\t\tMODULES.add(new WorldSparklesModule());\n\t\tMODULES.add(new TargetHighlightModule());\n\t\tMODULES.add(new FootstepParticlesModule());\n\t\tMODULES.add(new TargetHudModule());\n\t\tMODULES.add(new TotemCounterModule());\n\t\tMODULES.add(new HitmarkerModule());\n\t\tMODULES.add(new JumpEffectsModule());\n"
          if "new SprintModule()" not in text:
              if marker not in text:
                  raise SystemExit("Could not find movement registration point in ModuleManager")
              text = text.replace(marker, additions + marker, 1)
          for name in ("Aura", "Criticals", "Auto Armor", "Offhand", "Gap", "Auto Mace", "Auto Pearl Catch", "Auto Potion", "Auto Crystal", "Surround", "Auto Web Trap", "Anti Knockback", "Trap", "Surround Miner", "Self Trap", "Elytra Target", "Elytra Mace Target", "Elytra Freeze", "Attribute Swap", "Anti Phase", "Pearl Predict", "Projectile Predict", "Trajectories", "Auto Wither", "Totem", "Trigger Bot", "Auto Totem"):
              import re
              text = re.sub(r'^\s*\{"' + re.escape(name) + r'", [^\n]*\},?\n', '', text, flags=re.MULTILINE)
          manager.write_text(text)
          PY

      - name: Validate registered ION modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("ion-client/src/main/java/com/suschunkfinder")
          required = [
              "SprintModule.java", "AutoJumpModule.java", "NoFallModule.java", "AuraModule.java", "CriticalsModule.java", "AutoArmorModule.java", "OffhandModule.java", "GapModule.java", "AutoMaceModule.java", "AutoPearlCatchModule.java", "AutoPotionModule.java", "AutoCrystalModule.java", "SurroundModule.java", "AutoWebTrapModule.java", "AntiKnockbackModule.java", "TrapModule.java", "SurroundMinerModule.java", "SelfTrapModule.java", "ElytraTargetModule.java", "ElytraMaceTargetModule.java", "ElytraFreezeModule.java", "AttributeSwapModule.java", "AntiPhaseModule.java", "PearlPredictModule.java", "ProjectilePredictModule.java", "TrajectoriesModule.java", "AutoWitherModule.java", "TotemModule.java", "TotemModule.java",
              "TriggerBotModule.java", "HighJumpModule.java", "AirJumpModule.java",
              "DolphinModule.java", "SpeedModule.java", "LongJumpModule.java",
              "ParkourModule.java", "AmbientParticlesModule.java",
              "WorldSparklesModule.java", "AutoTotemModule.java",
              "TargetHighlightModule.java", "FootstepParticlesModule.java",
              "TargetHudModule.java", "TotemCounterModule.java",
              "HitmarkerModule.java", "JumpEffectsModule.java",
              "StepModule.java", "SpiderModule.java", "ElytraBoostModule.java",
              "LandingEffectsModule.java", "OrbitParticlesModule.java",
              "ClientModule.java", "ModuleKeybinds.java", "ModuleSettingsScreen.java", "NumberSetting.java", "HaloModule.java", "TargetTrailsModule.java", "PlayerTrailsModule.java", "CriticalParticlesModule.java", "ThemeModule.java"
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit("Missing registered module sources: " + ", ".join(missing))
          base = (root / "ClientModule.java").read_text()
          if "public void onBindAction() { tick(Minecraft.getInstance()); }" not in base:
              raise SystemExit("Action bind hook is missing")
          auto_totem = (root / "AutoTotemModule.java").read_text()
          if "Keeps a totem in your offhand" not in auto_totem:
              raise SystemExit("Auto Totem behavior description is missing")
          theme = (root / "ThemeModule.java").read_text()
          if '"Custom"' not in theme or '"Custom red"' not in theme:
              raise SystemExit("Custom RGB theme settings are missing")
          binds = (root / "ModuleKeybinds.java").read_text()
          if "private static void syncHolds()" not in binds:
              raise SystemExit("Hold bind release handling is missing")
          settings = (root / "ModuleSettingsScreen.java").read_text()
          if "number.change(false); ModuleManager.save();" not in settings:
              raise SystemExit("Numeric setting persistence is missing")
          if "sliders.add(new Slider(number, x, y + 22));" not in settings:
              raise SystemExit("Numeric setting sliders are missing")
          numeric = (root / "NumberSetting.java").read_text()
          if "public double min()" not in numeric or "public double max()" not in numeric:
              raise SystemExit("Numeric setting slider bounds are missing")
          for name in ("GapModule.java", "AutoMaceModule.java", "AutoPearlCatchModule.java"):
              source = (root / name).read_text()
              if ".selected" in source:
                  raise SystemExit(name + " uses a private inventory field")
              if "getSelectedSlot()" not in source or "setSelectedSlot(" not in source:
                  raise SystemExit(name + " is missing selected-slot accessors")
          mace = (root / "AutoMaceModule.java").read_text()
          if '"Require spear in hand"' not in mace or "heldName.contains(\\"spear\\")" not in mace:
              raise SystemExit("Spear-to-mace combo guard is missing")
          armor = (root / "AutoArmorModule.java").read_text()
          if "private static int tier(String name)" not in armor or "ClickType.PICKUP" not in armor:
              raise SystemExit("Auto Armor upgrade-and-swap logic is missing")
          combat = (root / "AutoPearlCatchModule.java").read_text()
          if "public void onBindAction()" not in combat or "Items.ENDER_PEARL" not in combat:
              raise SystemExit("Manual pearl clutch action is incomplete")
          print(f"Validated {len(required)} ION module sources, bind modes, and combat actions.")
          PY

      - name: Inspect extracted project sources
        run: |
          echo '=== PROJECT FILES ==='
          find ion-client -maxdepth 10 -type f | sort | head -300
          echo '=== JAVA SOURCES ==='
          while IFS= read -r file; do
            echo "===== $file ====="
            sed -n '1,260p' "$file"
          done < <(find ion-client -type f -name '*.java' | sort)

      - name: Patch Minecraft 1.21.11 GUI source compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          click = Path("ion-client/src/main/java/com/suschunkfinder/ClickGuiScreen.java")
          text = click.read_text()
          old = """\t\t\tString title = i == 0 ? "Search" : CATS[i - 1].label;

                      // Layered panel edge, dark surface, and thin purple highlight.
                      g.fill(x + 2, TOP + 2, x + panelW + 2, top + visible + 2, 0x55000000);
                      g.fill(x, TOP, x + panelW, top + visible, 0xFF252033);
          """
          new = """\t\t\tString title = i == 0 ? "Search" : CATS[i - 1].label;
                      List<ClientModule> list = listFor(i);
                      int top = bodyTop(i);
                      int visible = visibleHeight(i);

                      // Layered panel edge, dark surface, and thin purple highlight.
                      g.fill(x + 2, TOP + 2, x + panelW + 2, top + visible + 2, 0x55000000);
                      g.fill(x, TOP, x + panelW, top + visible, 0xFF252033);
          """
          if old not in text:
              raise SystemExit("Could not safely locate ClickGuiScreen panel block")
          text = text.replace(old, new, 1)
          duplicate = """\t\t\tList<ClientModule> list = listFor(i);
          \t\t\tint top = bodyTop(i);
          \t\t\tint visible = visibleHeight(i);
          \t\t\tint maxScroll"""
          if duplicate not in text:
              raise SystemExit("Could not safely locate duplicate ClickGuiScreen declarations")
          text = text.replace(duplicate, """\t\t\tint maxScroll""", 1)
          click.write_text(text)

          settings = Path("ion-client/src/main/java/com/suschunkfinder/ModuleSettingsScreen.java")
          text = settings.read_text()
          text = text.replace(
              "public boolean keyPressed(int keyCode, int scanCode, int modifiers) {",
              "public boolean keyPressed(net.minecraft.client.input.KeyEvent event) {"
          )
          text = text.replace(
              "ModuleKeybinds.set(module, keyCode == 256 ? 0 : keyCode);",
              "ModuleKeybinds.set(module, event.key() == 256 ? 0 : event.key());"
          )
          text = text.replace(
              "return super.keyPressed(keyCode, scanCode, modifiers);",
              "return super.keyPressed(event);"
          )
          if "keyPressed(int keyCode, int scanCode, int modifiers)" in text:
              raise SystemExit("Old keyPressed signature still present")
          settings.write_text(text)
          PY

      - name: Build Fabric mod (retry transient downloads)
        working-directory: ion-client
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if ./gradlew --no-daemon --no-configuration-cache build; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting 20 seconds before retry..."
              sleep 20
            fi
          done
          exit 1

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: ION-CLIENT-jar
          path: ion-client/build/libs/*.jar
          if-no-files-found: error
