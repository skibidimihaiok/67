name: Build ION CLIENT

on:
  push:
    paths:
      - 'ION-CLIENT-visuals-experimental.zip'
      - '.github/workflows/ion-client-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download and inspect Anubis release
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/anubis-release.zip "https://github.com/skibidimihaiok/67/releases/download/Anubis/Anubis.Beta.0.9.9.1.zip"
          mkdir -p /tmp/anubis-release /tmp/anubis-decompiled
          unzip -q /tmp/anubis-release.zip -d /tmp/anubis-release
          echo "=== RELEASE FILES ==="
          find /tmp/anubis-release -maxdepth 4 -type f | sort | head -200
          echo "=== ANUBIS LICENSE ==="
          if [ -f /tmp/anubis-release/LICENSE_anubis ]; then
            sed -n '1,220p' /tmp/anubis-release/LICENSE_anubis
          fi
          # Skip nested Fabric dependencies and select the actual client JAR.
          ANUBIS_JAR="$(find /tmp/anubis-release -type f -iname '*.jar' ! -path '*/META-INF/jars/*' | sort | head -1)"
          if [ -z "$ANUBIS_JAR" ]; then
            echo "No top-level Anubis client JAR found inside the release ZIP"
            echo "Available JARs:"
            find /tmp/anubis-release -type f -iname '*.jar' | sort
            exit 1
          fi
          echo "Inspecting Anubis client: $ANUBIS_JAR"
          curl -fL --retry 3 -o /tmp/cfr.jar "https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar"
          java -jar /tmp/cfr.jar "$ANUBIS_JAR" --outputdir /tmp/anubis-decompiled --silent true
          echo "=== DECOMPILED SOURCE FILES ==="
          find /tmp/anubis-decompiled -type f -name '*.java' | sort | head -300
          echo "=== REQUESTED MODULE MATCHES ==="
          grep -RilE 'Auto.?Relog|Free.?cam|Free.?look|Spotify|Region.?Map|Storage.?ESP|Player.?ESP|Anti.?Vanish|Player.?Bypass|Kill.?Aura|Tracers' /tmp/anubis-decompiled --include='*.java' | sort | head -100 || true
          echo "=== REQUESTED MODULE SOURCE EXCERPTS ==="
          while IFS= read -r file; do
            echo "===== $file ====="
            sed -n '1,260p' "$file"
          done < <(grep -RilE 'Auto.?Relog|Free.?cam|Free.?look|Spotify|Region.?Map|Storage.?ESP|Player.?ESP|Anti.?Vanish|Player.?Bypass|Kill.?Aura|Tracers' /tmp/anubis-decompiled --include='*.java' | sort | head -30)
      - name: Upload Anubis decompiled source for review
        uses: actions/upload-artifact@v4
        with:
          name: anubis-decompiled-source
          path: /tmp/anubis-decompiled
          if-no-files-found: error

      - name: Extract ION CLIENT source
        run: |
          mkdir ion-client
          unzip -q ION-CLIENT-visuals-experimental.zip -d ion-client

      - name: Apply ION module overrides
        run: |
          cp -R ion-client-overrides/src/main/java/. ion-client/src/main/java/
          python3 - <<'PY'
          from pathlib import Path
          manager = Path("ion-client/src/main/java/com/suschunkfinder/ModuleManager.java")
          text = manager.read_text()
          marker = "\t\t// Macro"
          additions = "\t\tMODULES.add(new CoordinatesHudModule());\n\t\tMODULES.add(new FpsHudModule());\n\t\tMODULES.add(new ArmorHudModule());\n\t\tMODULES.add(new SprintModule());\n\t\tMODULES.add(new AutoJumpModule());\n\t\tMODULES.add(new NoFallModule());\n\t\tMODULES.add(new TriggerBotModule());\n\t\tMODULES.add(new AutoTotemModule());\n\t\tMODULES.add(new AuraModule());\n\t\tMODULES.add(new CriticalsModule());\n\t\tMODULES.add(new AutoArmorModule());\n\t\tMODULES.add(new OffhandModule());\n\t\tMODULES.add(new GapModule());\n\t\tMODULES.add(new AutoMaceModule());\n\t\tMODULES.add(new AutoPearlCatchModule());\n\t\tMODULES.add(new AutoPotionModule());\n\t\tMODULES.add(new AutoCrystalModule());\n\t\tMODULES.add(new SurroundModule());\n\t\tMODULES.add(new AutoWebTrapModule());\n\t\tMODULES.add(new AntiKnockbackModule());\n\t\tMODULES.add(new TrapModule());\n\t\tMODULES.add(new SurroundMinerModule());\n\t\tMODULES.add(new SelfTrapModule());\n\t\tMODULES.add(new ElytraTargetModule());\n\t\tMODULES.add(new ElytraMaceTargetModule());\n\t\tMODULES.add(new ElytraFreezeModule());\n\t\tMODULES.add(new AttributeSwapModule());\n\t\tMODULES.add(new AntiPhaseModule());\n\t\tMODULES.add(new PearlPredictModule());\n\t\tMODULES.add(new ProjectilePredictModule());\n\t\tMODULES.add(new TrajectoriesModule());\n\t\tMODULES.add(new AutoWitherModule());\n\t\tMODULES.add(new TotemModule());\n\t\tMODULES.add(new HighJumpModule());\n\t\tMODULES.add(new AirJumpModule());\n\t\tMODULES.add(new DolphinModule());\n\t\tMODULES.add(new SpeedModule());\n\t\tMODULES.add(new LongJumpModule());\n\t\tMODULES.add(new ParkourModule());\n\t\tMODULES.add(new StepModule());\n\t\tMODULES.add(new SpiderModule());\n\t\tMODULES.add(new ElytraBoostModule());\n\t\tMODULES.add(new LandingEffectsModule());\n\t\tMODULES.add(new OrbitParticlesModule());\n\t\tMODULES.add(new HaloModule());\n\t\tMODULES.add(new TargetTrailsModule());\n\t\tMODULES.add(new PlayerTrailsModule());\n\t\tMODULES.add(new CriticalParticlesModule());\n\t\tMODULES.add(new AmbientParticlesModule());\n\t\tMODULES.add(new WorldSparklesModule());\n\t\tMODULES.add(new TargetHighlightModule());\n\t\tMODULES.add(new FootstepParticlesModule());\n\t\tMODULES.add(new TargetHudModule());\n\t\tMODULES.add(new TotemCounterModule());\n\t\tMODULES.add(new HitmarkerModule());\n\t\tMODULES.add(new JumpEffectsModule());\n"
          if "new SprintModule()" not in text:
              if marker not in text:
                  raise SystemExit("Could not find movement registration point in ModuleManager")
              text = text.replace(marker, additions + marker, 1)
          for name in ("Aura", "Criticals", "Auto Armor", "Offhand", "Gap", "Auto Mace", "Auto Pearl Catch", "Auto Potion", "Auto Crystal", "Surround", "Auto Web Trap", "Anti Knockback", "Trap", "Surround Miner", "Self Trap", "Elytra Target", "Elytra Mace Target", "Elytra Freeze", "Attribute Swap", "Anti Phase", "Pearl Predict", "Projectile Predict", "Trajectories", "Auto Wither", "Totem", "Trigger Bot", "Auto Totem", "Anti Aim"):
              import re
              text = re.sub(r'^\s*\{"' + re.escape(name) + r'", [^\n]*\},?\n', '', text, flags=re.MULTILINE)
          manager.write_text(text)
          PY

      - name: Smooth movement-following render effects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("ion-client/src/main/java/com/suschunkfinder")
          replacements = {
              "HaloModule.java": [
                  ("Vec3 p=c.player.position();", "Vec3 p=c.player.getPosition(pt);"),
              ],
              "AmbientParticlesModule.java": [
                  ("Vec3 p=c.player.position();", "Vec3 p=c.player.getPosition(pt);"),
              ],
              "OrbitParticlesModule.java": [
                  ("Vec3 p=c.player.position();", "Vec3 p=c.player.getPosition(pt);"),
              ],
              "WorldSparklesModule.java": [
                  ("Vec3 p=c.player.position();", "Vec3 p=c.player.getPosition(pt);"),
              ],
              "TargetHighlightModule.java": [
                  ("AABB a=e.getBoundingBox().inflate(0.06);", "Vec3 renderPos=e.getPosition(pt); Vec3 offset=renderPos.subtract(e.position()); AABB a=e.getBoundingBox().move(offset).inflate(0.06);"),
                  ("VisualEffects.circle(b,e.position(),", "VisualEffects.circle(b,renderPos,"),
              ],
              "PlayerTrailsModule.java": [
                  ("VisualEffects.trail(b,new ArrayList<>(path),q[0],q[1],q[2]);", "Vec3 offset=Minecraft.getInstance().player.getPosition(pt).subtract(Minecraft.getInstance().player.position()); List<Vec3> smooth=new ArrayList<>(); for(Vec3 point:path)smooth.add(point.add(offset)); VisualEffects.trail(b,smooth,q[0],q[1],q[2]);"),
              ],
              "TargetTrailsModule.java": [
                  ("VisualEffects.trail(b,new ArrayList<>(path),q[0],q[1],q[2]);", "Minecraft c=Minecraft.getInstance(); if(c.crosshairPickEntity instanceof LivingEntity e){Vec3 offset=e.getPosition(pt).subtract(e.position()); List<Vec3> smooth=new ArrayList<>(); for(Vec3 point:path)smooth.add(point.add(offset)); VisualEffects.trail(b,smooth,q[0],q[1],q[2]);}"),
              ],
          }
          for filename, pairs in replacements.items():
              path = root / filename
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Could not locate expected interpolation point in {filename}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          print("Applied render partial-tick interpolation to player- and target-following effects.")
          PY

      - name: Repair ESP tracers and camera controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("ion-client/src/main/java/com/suschunkfinder")
          
          target = root / "TargetHighlightModule.java"
          text = target.read_text()
          if "import net.minecraft.world.phys.Vec3;" not in text:
              text = text.replace("import net.minecraft.world.phys.AABB;", "import net.minecraft.world.phys.AABB;\nimport net.minecraft.world.phys.Vec3;")
          target.write_text(text)

          player = root / "PlayerEspModule.java"
          text = player.read_text()
          if 'BoolSetting tracers = add(BoolSetting.of("Tracers", true))' not in text:
              text = text.replace(
                  'private final BoolSetting fill = add(BoolSetting.of("Filled", true));',
                  'private final BoolSetting fill = add(BoolSetting.of("Filled", true));\n\tprivate final BoolSetting tracers = add(BoolSetting.of("Tracers", true));'
              )
              old = 'AABB b = EspUtil.lerped(entity, pt);'
              new = old + '\n\t\t\tif (tracers.get()) {\n\t\t\t\tvar eye = client.player.getEyePosition(pt);\n\t\t\t\tvar center = b.getCenter();\n\t\t\t\tbatch.line(eye, center, c[0], c[1], c[2], 0.95f, 0.045);\n\t\t\t}'
              if old not in text: raise SystemExit("Player ESP interpolation anchor missing")
              text = text.replace(old, new, 1)
          player.write_text(text)

          storage = root / "StorageEspModule.java"
          text = storage.read_text()
          if 'BoolSetting tracers = add(BoolSetting.of("Tracers", true))' not in text:
              text = text.replace("package com.suschunkfinder;\n", "package com.suschunkfinder;\n\nimport net.minecraft.client.Minecraft;\nimport net.minecraft.world.phys.Vec3;\n", 1)
              text = text.replace(
                  'private final BoolSetting fill = add(BoolSetting.of("Filled", true));',
                  'private final BoolSetting fill = add(BoolSetting.of("Filled", true));\n\tprivate final BoolSetting tracers = add(BoolSetting.of("Tracers", true));'
              )
              old = 'EspUtil.block(batch, be.getBlockPos(), c, fill.get());'
              new = old + '\n\t\t\t\tif (tracers.get()) {\n\t\t\t\t\tMinecraft client = Minecraft.getInstance();\n\t\t\t\t\tif (client.player != null) {\n\t\t\t\t\t\tVec3 start = client.player.getEyePosition();\n\t\t\t\t\t\tVec3 end = Vec3.atCenterOf(be.getBlockPos());\n\t\t\t\t\t\tbatch.line(start, end, c[0], c[1], c[2], 0.9f, 0.04);\n\t\t\t\t\t}\n\t\t\t\t}'
              if old not in text: raise SystemExit("Storage ESP block anchor missing")
              text = text.replace(old, new, 1)
          storage.write_text(text)
          
          print("Added independent tracer toggles and world-space lines to Player ESP and Storage ESP.")
          PY

      - name: Validate registered ION modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("ion-client/src/main/java/com/suschunkfinder")
          required = [
              "CoordinatesHudModule.java", "FpsHudModule.java", "ArmorHudModule.java", "SprintModule.java", "AutoJumpModule.java", "NoFallModule.java", "AuraModule.java", "CriticalsModule.java", "AutoArmorModule.java", "OffhandModule.java", "GapModule.java", "AutoMaceModule.java", "AutoPearlCatchModule.java", "AutoPotionModule.java", "AutoCrystalModule.java", "SurroundModule.java", "AutoWebTrapModule.java", "AntiKnockbackModule.java", "TrapModule.java", "SurroundMinerModule.java", "SelfTrapModule.java", "ElytraTargetModule.java", "ElytraMaceTargetModule.java", "ElytraFreezeModule.java", "AttributeSwapModule.java", "AntiPhaseModule.java", "PearlPredictModule.java", "ProjectilePredictModule.java", "TrajectoriesModule.java", "AutoWitherModule.java", "TotemModule.java", "TotemModule.java",
              "TriggerBotModule.java", "HighJumpModule.java", "AirJumpModule.java",
              "DolphinModule.java", "SpeedModule.java", "LongJumpModule.java",
              "ParkourModule.java", "AmbientParticlesModule.java",
              "WorldSparklesModule.java", "AutoTotemModule.java",
              "TargetHighlightModule.java", "FootstepParticlesModule.java",
              "TargetHudModule.java", "TotemCounterModule.java",
              "HitmarkerModule.java", "JumpEffectsModule.java",
              "StepModule.java", "SpiderModule.java", "ElytraBoostModule.java",
              "LandingEffectsModule.java", "OrbitParticlesModule.java",
              "ClientModule.java", "ModuleKeybinds.java", "ModuleSettingsScreen.java", "NumberSetting.java", "HaloModule.java", "TargetTrailsModule.java", "PlayerTrailsModule.java", "CriticalParticlesModule.java", "ThemeModule.java"
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit("Missing registered module sources: " + ", ".join(missing))
          base = (root / "ClientModule.java").read_text()
          if "public void onBindAction() { tick(Minecraft.getInstance()); }" not in base:
              raise SystemExit("Action bind hook is missing")
          auto_totem = (root / "AutoTotemModule.java").read_text()
          if "Keeps a totem in your offhand" not in auto_totem:
              raise SystemExit("Auto Totem behavior description is missing")
          theme = (root / "ThemeModule.java").read_text()
          if '"Custom"' not in theme or '"Custom red"' not in theme:
              raise SystemExit("Custom RGB theme settings are missing")
          binds = (root / "ModuleKeybinds.java").read_text()
          if "private static void syncHolds()" not in binds:
              raise SystemExit("Hold bind release handling is missing")
          settings = (root / "ModuleSettingsScreen.java").read_text()
          if "number.change(false); ModuleManager.save();" not in settings:
              raise SystemExit("Numeric setting persistence is missing")
          if "sliders.add(new Slider(number, x, y + 22));" not in settings:
              raise SystemExit("Numeric setting sliders are missing")
          numeric = (root / "NumberSetting.java").read_text()
          if "public double min()" not in numeric or "public double max()" not in numeric:
              raise SystemExit("Numeric setting slider bounds are missing")
          for name in ("GapModule.java", "AutoMaceModule.java", "AutoPearlCatchModule.java"):
              source = (root / name).read_text()
              if ".selected" in source:
                  raise SystemExit(name + " uses a private inventory field")
              if "getSelectedSlot()" not in source or "setSelectedSlot(" not in source:
                  raise SystemExit(name + " is missing selected-slot accessors")
          mace = (root / "AutoMaceModule.java").read_text()
          if '"Require spear in hand"' not in mace or "heldName.contains(" not in mace or "spear" not in mace:
              raise SystemExit("Spear-to-mace combo guard is missing")
          knockback = (root / "AntiKnockbackModule.java").read_text()
          if '"Horizontal velocity %", 0' not in knockback or '"Vertical velocity %", 0' not in knockback:
              raise SystemExit("Anti Knockback defaults are not zero velocity")
          armor = (root / "AutoArmorModule.java").read_text()
          if "private static int tier(String name)" not in armor or "ClickType.PICKUP" not in armor:
              raise SystemExit("Auto Armor upgrade-and-swap logic is missing")
          combat = (root / "AutoPearlCatchModule.java").read_text()
          if "public void onBindAction()" not in combat or "Items.ENDER_PEARL" not in combat:
              raise SystemExit("Manual pearl clutch action is incomplete")
          print(f"Validated {len(required)} ION module sources, bind modes, and combat actions.")
          PY

      - name: Inspect extracted project sources
        run: |
          echo '=== PROJECT FILES ==='
          find ion-client -maxdepth 10 -type f | sort | head -300
          echo '=== JAVA SOURCES ==='
          while IFS= read -r file; do
            echo "===== $file ====="
            sed -n '1,260p' "$file"
          done < <(find ion-client -type f -name '*.java' | sort)

      - name: Patch Minecraft 1.21.11 GUI source compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          click = Path("ion-client/src/main/java/com/suschunkfinder/ClickGuiScreen.java")
          text = click.read_text()
          old = """\t\t\tString title = i == 0 ? "Search" : CATS[i - 1].label;

                      // Layered panel edge, dark surface, and thin purple highlight.
                      g.fill(x + 2, TOP + 2, x + panelW + 2, top + visible + 2, 0x55000000);
                      g.fill(x, TOP, x + panelW, top + visible, 0xFF252033);
          """
          new = """\t\t\tString title = i == 0 ? "Search" : CATS[i - 1].label;
                      List<ClientModule> list = listFor(i);
                      int top = bodyTop(i);
                      int visible = visibleHeight(i);

                      // Layered panel edge, dark surface, and thin purple highlight.
                      g.fill(x + 2, TOP + 2, x + panelW + 2, top + visible + 2, 0x55000000);
                      g.fill(x, TOP, x + panelW, top + visible, 0xFF252033);
          """
          if old not in text:
              raise SystemExit("Could not safely locate ClickGuiScreen panel block")
          text = text.replace(old, new, 1)
          duplicate = """\t\t\tList<ClientModule> list = listFor(i);
          \t\t\tint top = bodyTop(i);
          \t\t\tint visible = visibleHeight(i);
          \t\t\tint maxScroll"""
          if duplicate not in text:
              raise SystemExit("Could not safely locate duplicate ClickGuiScreen declarations")
          text = text.replace(duplicate, """\t\t\tint maxScroll""", 1)
          click.write_text(text)

          settings = Path("ion-client/src/main/java/com/suschunkfinder/ModuleSettingsScreen.java")
          text = settings.read_text()
          text = text.replace(
              "public boolean keyPressed(int keyCode, int scanCode, int modifiers) {",
              "public boolean keyPressed(net.minecraft.client.input.KeyEvent event) {"
          )
          text = text.replace(
              "ModuleKeybinds.set(module, keyCode == 256 ? 0 : keyCode);",
              "ModuleKeybinds.set(module, event.key() == 256 ? 0 : event.key());"
          )
          text = text.replace(
              "return super.keyPressed(keyCode, scanCode, modifiers);",
              "return super.keyPressed(event);"
          )
          if "keyPressed(int keyCode, int scanCode, int modifiers)" in text:
              raise SystemExit("Old keyPressed signature still present")
          settings.write_text(text)
          PY

      - name: Replace the old ClickGUI with the Prestige-inspired layout
        run: |
          cat > ion-client/src/main/java/com/suschunkfinder/ClickGuiScreen.java <<'JAVA'
          package com.suschunkfinder;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.EditBox;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.input.MouseButtonEvent;
          import net.minecraft.network.chat.Component;

          /** Original ION-styled ClickGUI: compact header, category tabs and clean module rows. */
          public class ClickGuiScreen extends Screen {
              private static final int[] SCROLL = new int[ClientModule.Category.values().length];
              private static final ClientModule.Category[] CATS = ClientModule.Category.values();
              private static final int ROW_H = 31;
              private static String lastSearch = "";
              private int left, top, panelWidth, panelHeight, contentX, contentW, selected;
              private EditBox search;

              public ClickGuiScreen() { super(Component.literal("ION CLIENT")); }
              @Override public boolean isPauseScreen() { return false; }

              @Override protected void init() {
                  panelWidth = Math.min(this.width - 24, 690);
                  panelHeight = Math.min(this.height - 24, 390);
                  left = (this.width - panelWidth) / 2;
                  top = (this.height - panelHeight) / 2;
                  contentX = left + 18;
                  contentW = panelWidth - 36;
                  search = new EditBox(font, left + panelWidth - 178, top + 17, 154, 18, Component.literal("Search modules"));
                  search.setMaxLength(32);
                  search.setValue(lastSearch);
                  search.setHint(Component.literal("Search..."));
                  search.setResponder(value -> { lastSearch = value; SCROLL[selected] = 0; });
                  addRenderableWidget(search);
              }

              private List<ClientModule> modules() {
                  List<ClientModule> out = new ArrayList<>();
                  String q = lastSearch.trim().toLowerCase(Locale.ROOT);
                  for (ClientModule m : ModuleManager.in(CATS[selected])) {
                      if (q.isEmpty() || m.name.toLowerCase(Locale.ROOT).contains(q)) out.add(m);
                  }
                  return out;
              }

              @Override public boolean mouseClicked(MouseButtonEvent event, boolean doubleClick) {
                  if (super.mouseClicked(event, doubleClick)) return true;
                  double mx = event.x(), my = event.y();
                  int tabY = top + 53;
                  int tabW = Math.max(66, (contentW - (CATS.length - 1) * 5) / CATS.length);
                  for (int i = 0; i < CATS.length; i++) {
                      int tx = contentX + i * (tabW + 5);
                      if (mx >= tx && mx < tx + tabW && my >= tabY && my < tabY + 27) {
                          selected = i; SCROLL[selected] = 0; return true;
                      }
                  }
                  int listTop = top + 91;
                  if (mx >= contentX && mx < contentX + contentW && my >= listTop && my < top + panelHeight - 18) {
                      int colW = (contentW - 12) / 2;
                      int col = mx < contentX + colW ? 0 : 1;
                      int row = (int)(my - listTop + SCROLL[selected] * ROW_H) / ROW_H;
                      List<ClientModule> list = modules();
                      int perCol = (list.size() + 1) / 2;
                      int index = col * perCol + row;
                      if (index >= 0 && index < list.size()) {
                          ClientModule module = list.get(index);
                          if (event.button() == 1) minecraft.setScreen(new ModuleSettingsScreen(module, this));
                          else if (event.button() == 0) module.setEnabled(!module.isEnabled());
                          return true;
                      }
                  }
                  return false;
              }

              @Override public boolean mouseScrolled(double mouseX, double mouseY, double scrollX, double scrollY) {
                  int rows = (modules().size() + 1) / 2;
                  int visible = Math.max(1, (panelHeight - 125) / ROW_H);
                  SCROLL[selected] = Math.max(0, Math.min(Math.max(0, rows - visible), SCROLL[selected] - (int)Math.signum(scrollY) * 2));
                  return true;
              }

              @Override public void renderBackground(GuiGraphics graphics, int mouseX, int mouseY, float delta) { }

              @Override public void render(GuiGraphics g, int mouseX, int mouseY, float delta) {
                  int x = left, y = top, right = left + panelWidth, bottom = top + panelHeight;
                  // ION's own graphite-and-electric-cyan visual identity.
                  g.fill(0, 0, this.width, this.height, 0x99040A12);
                  g.fill(x + 5, y + 6, right + 5, bottom + 6, 0x77000000);
                  g.fill(x, y, right, bottom, 0xFF0B111B);
                  g.fill(x + 1, y + 1, right - 1, bottom - 1, 0xFF101A27);
                  g.fill(x + 1, y + 1, right - 1, y + 45, 0xFF111E2C);
                  g.fill(x + 1, y + 44, right - 1, y + 46, ThemeModule.color());
                  g.fill(x + 1, y + 1, x + 3, bottom - 1, ThemeModule.color());

                  g.drawString(font, "ION", x + 18, y + 13, ThemeModule.color(), true);
                  g.drawString(font, "CLIENT", x + 45, y + 13, 0xFFF1F7FC, true);
                  g.drawString(font, "CONTROL CENTER  •  FABRIC", x + 18, y + 29, 0xFF7894AE, false);
                  g.drawString(font, "v1.0", right - 43, y + 18, 0xFF7894AE, false);
                  super.render(g, mouseX, mouseY, delta);

                  int tabY = y + 53;
                  int tabW = Math.max(66, (contentW - (CATS.length - 1) * 5) / CATS.length);
                  for (int i = 0; i < CATS.length; i++) {
                      int tx = contentX + i * (tabW + 5);
                      boolean active = i == selected;
                      g.fill(tx, tabY, tx + tabW, tabY + 27, active ? 0xFF16465A : 0xFF172433);
                      if (active) g.fill(tx + 1, tabY + 24, tx + tabW - 1, tabY + 26, ThemeModule.color());
                      String label = CATS[i].label;
                      g.drawCenteredString(font, label, tx + tabW / 2, tabY + 9, active ? 0xFFECFCFF : 0xFF91A8BE);
                  }

                  List<ClientModule> list = modules();
                  g.drawString(font, CATS[selected].label.toUpperCase(Locale.ROOT), contentX, y + 85, 0xFFEAF5FC, true);
                  g.drawString(font, list.size() + " MODULES", right - 92, y + 85, 0xFF7894AE, false);

                  int listTop = y + 101;
                  int colW = (contentW - 12) / 2;
                  int perCol = (list.size() + 1) / 2;
                  int visible = Math.max(1, (panelHeight - 125) / ROW_H);
                  for (int col = 0; col < 2; col++) {
                      int cx = contentX + col * (colW + 12);
                      for (int row = 0; row < visible; row++) {
                          int index = col * perCol + row + SCROLL[selected];
                          if (index >= list.size()) break;
                          ClientModule m = list.get(index);
                          int ry = listTop + row * ROW_H;
                          boolean over = mouseX >= cx && mouseX < cx + colW && mouseY >= ry && mouseY < ry + ROW_H - 3;
                          g.fill(cx, ry, cx + colW, ry + ROW_H - 3, over ? 0xFF203448 : 0xFF172534);
                          g.fill(cx, ry, cx + 2, ry + ROW_H - 3, m.isEnabled() ? 0xFF22D5EE : 0xFF304457);
                          g.drawString(font, Hud.fit(m.name, colW - 62), cx + 11, ry + 10, m.isEnabled() ? 0xFFF1FCFF : 0xFFB1C2D1, false);
                          int sx = cx + colW - 37, sy = ry + 9;
                          g.fill(sx, sy, sx + 25, sy + 13, m.isEnabled() ? ThemeModule.color() : 0xFF34485B);
                          int knob = m.isEnabled() ? sx + 14 : sx + 2;
                          g.fill(knob, sy + 2, knob + 9, sy + 11, m.isEnabled() ? 0xFFB8FAFF : 0xFF9BAEBE);
                      }
                  }
                  g.drawString(font, "LMB  Toggle     RMB  Settings     Scroll  Browse", contentX, bottom - 12, 0xFF718DA7, false);
              }
          }
          JAVA
      - name: Build Fabric mod (retry transient downloads)
        working-directory: ion-client
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if ./gradlew --no-daemon --no-configuration-cache build; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting 20 seconds before retry..."
              sleep 20
            fi
          done
          exit 1

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: ION-CLIENT-jar
          path: ion-client/build/libs/*.jar
          if-no-files-found: error

# Visual effect geometry sources are copied from ion-client-overrides during the build.
