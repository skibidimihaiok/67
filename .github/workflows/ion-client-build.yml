name: Build ION CLIENT

on:
  push:
    paths:
      - 'ION-CLIENT-visuals-experimental.zip'
      - '.github/workflows/ion-client-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract ION CLIENT source
        run: |
          mkdir ion-client
          unzip -q ION-CLIENT-visuals-experimental.zip -d ion-client

      - name: Show failing source sections
        run: |
          echo '--- ClickGuiScreen.java ---'
          nl -ba ion-client/src/main/java/com/suschunkfinder/ClickGuiScreen.java | sed -n '125,180p'
          echo '--- ModuleSettingsScreen.java ---'
          nl -ba ion-client/src/main/java/com/suschunkfinder/ModuleSettingsScreen.java | sed -n '1,130p'

      - name: Build Fabric mod
        working-directory: ion-client
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: ION-CLIENT-jar
          path: ion-client/build/libs/*.jar
          if-no-files-found: error
