name: Inspect latest ION client assets

on:
  workflow_dispatch:
  push:
    branches: [ion-client-development]
    paths:
      - '.github/workflows/ion-source-version-inspection.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository ION assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/ion-client.jar "https://raw.githubusercontent.com/skibidimihaiok/67/ion-client-development/ion-client-1.0.0.jar"
          curl -fL --retry 3 -o /tmp/ion-source.zip "https://raw.githubusercontent.com/skibidimihaiok/67/ion-client-development/ION-CLIENT-visuals-experimental.zip"
          sha256sum /tmp/ion-client.jar /tmp/ion-source.zip
          echo "=== JAR METADATA ==="
          unzip -p /tmp/ion-client.jar fabric.mod.json || true
          echo
          echo "=== JAR ENTRIES / MODULE CLASSES ==="
          unzip -Z1 /tmp/ion-client.jar | grep -Ei '(module|gui|screen|key|mixins|fabric.mod.json)' | head -500 || true
          echo "=== ZIP CONTENTS ==="
          unzip -l /tmp/ion-source.zip | head -500
          mkdir -p /tmp/ion-src
          unzip -q /tmp/ion-source.zip -d /tmp/ion-src
          echo "=== SOURCE PROJECT VERSION MARKERS ==="
          grep -RniE 'version|1\.21\.11|ION Client' /tmp/ion-src --include='*.gradle' --include='*.properties' --include='*.json' --include='*.md' | head -300 || true
          echo "=== SOURCE MODULE REGISTRY ==="
          find /tmp/ion-src -name ModuleManager.java -print -exec sed -n '1,320p' {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: latest-ion-source-comparison
          path: |
            /tmp/ion-client.jar
            /tmp/ion-source.zip
            /tmp/ion-src
          if-no-files-found: error
