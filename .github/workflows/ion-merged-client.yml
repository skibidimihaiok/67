name: Build single-file ION Client 1.21.11

on:
  push:
    branches: [ion-client-development]
    paths:
      - 'ION-CLIENT-visuals-experimental.zip' # wrapper only
      - 'ion-client-1.0.0.jar'
      - 'skbiditoilet-fixed (1).zip'
      - 'skbiditoilet-1.0.0.jar'
      - 'ion-client-overrides/src/main/java/**'
      - '.github/ION_BUILD_NOW.txt'
      - '.github/workflows/ion-merged-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Decompile the supplied ION 1.0.0 reference JAR
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar -o /tmp/cfr.jar
          mkdir -p /tmp/ion-decompiled
          java -Xmx3G -jar /tmp/cfr.jar ion-client-1.0.0.jar --outputdir /tmp/ion-decompiled --silent true
          echo "=== REFERENCE JAR METADATA ==="
          unzip -p ion-client-1.0.0.jar fabric.mod.json || true
          echo "=== DECOMPILED REFERENCE JAVA FILES ==="
          find /tmp/ion-decompiled -type f -name '*.java' | sort | sed -n '1,240p'
          for name in ClickGuiScreen.java Keys.java ModuleKeybinds.java ModuleManager.java; do
            file="$(find /tmp/ion-decompiled -type f -name "$name" -print -quit)"
            if [ -n "$file" ]; then
              echo "=== REFERENCE $name: $file ==="
              sed -n '1,220p' "$file"
            fi
          done

      - name: Prepare the original 1.21.11 source GUI and ION module sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/base-source /tmp/ion-wrapper
          unzip -q "skbiditoilet-fixed (1).zip" -d /tmp/base-source
          # The old ZIP is used only for a matching Gradle wrapper. All module
          # Java is recovered from the newer, user-supplied 1.0.0 JAR.
          unzip -q "ION-CLIENT-visuals-experimental.zip" -d /tmp/ion-wrapper
          BASE="$(dirname "$(find /tmp/base-source -type f -name build.gradle -print -quit)")"
          ION_ROOT="$(dirname "$(find /tmp/ion-wrapper -type f -name gradlew -print -quit)")"
          ION_JAVA="$(dirname "$(find /tmp/ion-decompiled -path '*/com/suschunkfinder/ModuleManager.java' -print -quit)")"
          test -n "$BASE" && test -n "$ION_ROOT" && test -n "$ION_JAVA"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "ION_ROOT=$ION_ROOT" >> "$GITHUB_ENV"
          echo "ION_JAVA=$ION_JAVA" >> "$GITHUB_ENV"
          # Only build tooling is borrowed from the old ZIP; its Java source is
          # deliberately not used.
          cp "$ION_ROOT/gradlew" "$BASE/gradlew"
          cp -R "$ION_ROOT/gradle" "$BASE/gradle"
          chmod +x "$BASE/gradlew"
          echo "Base GUI retained from Minecraft 1.21.11 project: $BASE"
          echo "ION modules recovered from ion-client-1.0.0.jar: $ION_JAVA"
          echo "=== BASE GUI AND KEYBIND CORE (unchanged source) ==="
          for name in ClickGuiScreen.java ModuleSettingsScreen.java Keys.java ModuleKeybinds.java ModuleManager.java; do
            file="$BASE/src/main/java/com/suschunkfinder/$name"
            if [ -f "$file" ]; then
              echo "=== BASE $name ==="
              sed -n '1,260p' "$file"
            fi
          done
          echo "=== BASE COORDINATES MODULE ==="
          sed -n '1,120p' "$BASE/src/main/java/com/suschunkfinder/CoordinatesHudModule.java"

      - name: Merge unique ION modules into the existing module registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$BASE" "$ION_JAVA" "$GITHUB_WORKSPACE/ion-client-overrides/src/main/java/com/suschunkfinder" <<'PY'
          from pathlib import Path
          import json, re, shutil, sys

          base = Path(sys.argv[1])
          ion = Path(sys.argv[2])
          overrides = Path(sys.argv[3])
          target = base / "src/main/java/com/suschunkfinder"
          manager = target / "ModuleManager.java"
          if not manager.is_file():
              raise SystemExit("The 1.21.11 base source has no ModuleManager.java")
          text = manager.read_text(encoding="utf-8")

          # Keep every module already registered by the selected 1.21.11 base.
          # Only import non-duplicate ION modules into this same registry.

          # These are deliberately not imported from ION. The base client's own
          # PvP/ESP implementations remain authoritative.
          excluded = {
              "KillAuraModule.java",
              "MaceModule.java",
              "AutoMaceModule.java",
              "StorageEspModule.java",
              "PlayerEspModule.java",
              "TracersModule.java",
              "CombatFeatureModule.java",
              "AuraModule.java",
              "ElytraTargetModule.java",
              "ElytraMaceTargetModule.java",
              "TriggerBotModule.java",
          }
          excluded_core = {
              "ClientModule.java", "ModuleManager.java", "ModuleKeybinds.java",
              "ModuleSettingsScreen.java", "ClickGuiScreen.java",
              "SusChunkFinderClient.java", "IonAddonRuntime.java",
              "IonAnubisAddon.java", "IonModuleAdapter.java",
              "IonModuleProvider.java",
          }

          def is_user_removed_module(class_name):
              folded = class_name.casefold()
              return (
                  folded in {"playerespmodule", "storageespmodule", "killa uramodule".replace(" ", ""),
                             "triggerbotmodule"}
                  or ("mace" in folded and folded.endswith("module"))
              )

          existing_files = {p.name for p in target.glob("*.java")}
          existing_classes = set(re.findall(r"new\s+([A-Za-z_$][\w$]*)\s*\(", text))
          registered = set(existing_classes)

          def display_name(path: Path):
              source = path.read_text(encoding="utf-8", errors="replace")
              match = re.search(r'super\s*\(\s*"([^"]+)"', source)
              return match.group(1).strip().casefold() if match else None

          existing_names = set()
          for cls in registered:
              candidate = target / (cls + ".java")
              if candidate.is_file():
                  name = display_name(candidate)
                  if name:
                      existing_names.add(name)

          candidates = {}
          for root in (ion, overrides):
              if not root.exists():
                  continue
              for path in root.rglob("*.java"):
                  if path.name in excluded or path.name in excluded_core or is_user_removed_module(path.stem):
                      continue
                  if path.name in existing_files:
                      continue
                  if path.name == "TurnMixin.java" or "anubisaddon" in path.parts or "mixin" in path.parts:
                      continue
                  candidates.setdefault(path.name, path)

          added_modules = []
          copied_helpers = []
          for filename, source in sorted(candidates.items()):
              if filename in excluded or filename in excluded_core:
                  continue
              destination = target / filename
              if destination.exists():
                  continue
              if filename.endswith("Module.java"):
                  cls = filename[:-5]
                  if cls in registered:
                      continue
                  name = display_name(source)
                  if name and name in existing_names:
                      print(f"SKIP duplicate display name: {filename} ({name})")
                      continue
                  shutil.copy2(source, destination)
                  added_modules.append(cls)
                  registered.add(cls)
                  if name:
                      existing_names.add(name)
              else:
                  shutil.copy2(source, destination)
                  copied_helpers.append(filename)

          if not added_modules:
              raise SystemExit("No unique ION modules were selected; refusing an empty merge.")

          marker = re.search(r"(?m)^\s*//\s*Macro\s*$", text)
          if marker:
              at = marker.start()
          else:
              marker = re.search(r"(?m)^\s*load\(\);", text)
              if not marker:
                  raise SystemExit("Could not find a safe module-registration insertion point.")
              at = marker.start()

          registrations = "".join(f"\t\tMODULES.add(new {cls}());\n" for cls in added_modules)
          text = text[:at] + registrations + text[at:]

          # Remove exactly the modules the user asked to exclude from the
          # original 1.21.11 registry; all other base modules stay untouched.
          removed_base_modules = []
          for source_file in sorted(target.glob("*Module.java")):
              class_name = source_file.stem
              if not is_user_removed_module(class_name):
                  continue
              pattern = r"(?m)^[ \t]*MODULES\.add\(new\s+" + re.escape(class_name) + r"\(\)\);[ \t]*\n?"
              text, removed_count = re.subn(pattern, "", text)
              if removed_count:
                  removed_base_modules.append(class_name)
                  source_file.unlink()

          manager.write_text(text, encoding="utf-8")

          # Support ION one-shot action modules within the original keybind layer.
          client_module = target / "ClientModule.java"
          client_text = client_module.read_text(encoding="utf-8")
          if "public void onBindAction()" not in client_text:
              marker = "\tprotected void onEnable()"
              if marker not in client_text:
                  raise SystemExit("Cannot safely extend ClientModule with its default bind action.")
              client_text = client_text.replace(
                  marker,
                  "\tpublic void onBindAction() { setEnabled(!isEnabled()); }\n\n" + marker,
                  1
              )
              client_module.write_text(client_text, encoding="utf-8")

          keybind_file = target / "ModuleKeybinds.java"
          keybind_text = keybind_file.read_text(encoding="utf-8")
          keybind_text = keybind_text.replace(
              "entry.getKey().setEnabled(!entry.getKey().isEnabled());",
              "entry.getKey().onBindAction();"
          )
          keybind_file.write_text(keybind_text, encoding="utf-8")

          # Keep the original 1.21.11 ClickGuiScreen, but make Left Shift its
          # default open key. It remains a normal, user-rebindable Minecraft key.
          keys_file = target / "Keys.java"
          keys_text = keys_file.read_text(encoding="utf-8")
          if "GLFW.GLFW_KEY_U" not in keys_text and "GLFW.GLFW_KEY_LEFT_SHIFT" not in keys_text:
              raise SystemExit("Could not find the original GUI key mapping in Keys.java.")
          # Give the GUI mapping a new translation key as well as a new
          # default key. Minecraft persists old KeyMapping assignments in
          # options.txt; keeping the old ID would preserve a previously saved U.
          keys_text = keys_text.replace("key.suschunkfinder.open_gui", "key.ionclient.open_gui", 1)
          keys_text = keys_text.replace("GLFW.GLFW_KEY_U", "GLFW.GLFW_KEY_LEFT_SHIFT", 1)
          keys_text = keys_text.replace("The U key opens the client menu.", "Left Shift opens the client menu.")
          if "key.suschunkfinder.open_gui" in keys_text or "GLFW.GLFW_KEY_U" in keys_text:
              raise SystemExit("The old saved GUI key mapping was not fully replaced.")
          keys_file.write_text(keys_text, encoding="utf-8")

          # Apply the 1.0.0 visual treatment inside the original 1.21.11
          # ClickGuiScreen. Input handling, settings navigation, and class identity
          # remain the base client's own implementation.
          gui_file = target / "ClickGuiScreen.java"
          gui_text = gui_file.read_text(encoding="utf-8")
          gui_text = gui_text.replace("private static final int TOP = 14;", "private static final int TOP = 28;", 1)
          gui_text = gui_text.replace('super(Component.literal("Sus Client"));', 'super(Component.literal("ION CLIENT"));', 1)
          gui_render = '''
          \t@Override
          \tpublic void render(GuiGraphics g, int mouseX, int mouseY, float delta) {
          \t\tint accent = Hud.accent();
          \t\tint accentFill = (accent & 0x00FFFFFF) | 0xC91B102B;
          \t\tint panelAlpha = ClickGuiModule.panelAlpha();
          \t\tint bodyColor = (panelAlpha << 24) | 0x101521;
          \t\tClientModule hovered = null;

          \t\tString brand = "ION CLIENT";
          \t\tString subtitle = "MODULAR CLIENT  /  1.21.11";
          \t\tg.drawString(this.font, brand, this.width / 2 - this.font.width(brand) / 2, 5, 0xFFF3F0FF, true);
          \t\tg.drawString(this.font, subtitle, this.width / 2 - this.font.width(subtitle) / 2, 16, 0xFF9690AA, false);
          \t\tg.fill(8, TOP - 2, this.width - 8, TOP - 1, 0x553D3158);

          \t\tfor (int i = 0; i <= CATS.length; i++) {
          \t\t\tint x = panelX(i);
          \t\t\tString title = i == 0 ? "Search" : CATS[i - 1].label;

          \t\t\tList<ClientModule> list = listFor(i);
          \t\t\tint top = bodyTop(i);
          \t\t\tint visible = visibleHeight(i);
          \t\t\tint maxScroll = Math.max(0, list.size() * ROW + 2 - visible);
          \t\t\tSCROLL[i] = Math.max(0, Math.min(SCROLL[i], maxScroll));

          \t\t\tg.fill(x + 2, TOP + 2, x + panelW + 2, top + visible + 2, 0x55000000);
          \t\t\tg.fill(x, TOP, x + panelW, top + visible, 0xFF252033);
          \t\t\tg.fill(x + 1, TOP + 1, x + panelW - 1, TOP + HEADER, 0xF0181B29);
          \t\t\tg.fill(x, TOP + HEADER - 1, x + panelW, TOP + HEADER, accent);
          \t\t\tg.fill(x, TOP, x + panelW, TOP + 1, 0x99FFFFFF);
          \t\t\tg.drawString(this.font, title, x + (panelW - this.font.width(title)) / 2, TOP + 4, Hud.WHITE, false);

          \t\t\tg.fill(x, TOP + HEADER, x + panelW, top + visible, bodyColor);
          \t\t\tif (i == 0 && lastSearch.isBlank()) {
          \t\t\t\tString hint = "Type a name";
          \t\t\t\tg.drawString(this.font, hint, x + (panelW - this.font.width(hint)) / 2, top + 4, 0xFF8890A0, false);
          \t\t\t}

          \t\t\tg.enableScissor(x, top, x + panelW, top + visible);
          \t\t\tfor (int r = 0; r < list.size(); r++) {
          \t\t\t\tClientModule module = list.get(r);
          \t\t\t\tint y = top + 1 + r * ROW - SCROLL[i];
          \t\t\t\tif (y + ROW < top || y > top + visible) {
          \t\t\t\t\tcontinue;
          \t\t\t\t}
          \t\t\t\tboolean over = mouseX >= x && mouseX < x + panelW && mouseY >= Math.max(y, top)
          \t\t\t\t\t\t&& mouseY < Math.min(y + ROW, top + visible);
          \t\t\t\tif (over) {
          \t\t\t\t\thovered = module;
          \t\t\t\t}
          \t\t\t\tif (module.isEnabled()) {
          \t\t\t\t\tg.fill(x + 1, y, x + panelW - 1, y + ROW, accentFill);
          \t\t\t\t\tg.fill(x + 1, y + 2, x + 3, y + ROW - 2, accent);
          \t\t\t\t} else if (over) {
          \t\t\t\t\tg.fill(x + 1, y, x + panelW - 1, y + ROW, 0x2EFFFFFF);
          \t\t\t\t}
          \t\t\t\tString name = Hud.fit(module.name, panelW - 12);
          \t\t\t\tg.drawString(this.font, name, x + 5, y + 3,
          \t\t\t\t\t\tmodule.isEnabled() ? Hud.WHITE : (over ? 0xFFE7DFFF : 0xFFB8BDCB), false);
          \t\t\t}
          \t\t\tg.disableScissor();
          \t\t}

          \t\tsuper.render(g, mouseX, mouseY, delta);

          \t\tString line = hovered != null
          \t\t\t\t? hovered.name + ": " + hovered.description
          \t\t\t\t: "Left click: on/off    Right click: settings    Scroll: move a long column";
          \t\tline = Hud.fit(line, this.width - 20);
          \t\tg.drawString(this.font, line, this.width / 2 - this.font.width(line) / 2, this.height - 16, 0xFFB0B8C8, true);
          \t}
          '''
          gui_render = gui_render.strip("\n")
          gui_text, gui_replaced = re.subn(
              r"(?s)\t@Override\n\tpublic void render\(GuiGraphics g, int mouseX, int mouseY, float delta\) \{.*?\n\t\}",
              lambda match: gui_render,
              gui_text,
              count=1
          )
          if gui_replaced != 1:
              raise SystemExit("Could not safely transplant the ION 1.0.0 visual style into the original GUI.")
          if "private static final int TOP = 28;" not in gui_text or "MODULAR CLIENT  /  1.21.11" not in gui_text:
              raise SystemExit("The original GUI did not receive the expected ION visual treatment.")
          gui_file.write_text(gui_text, encoding="utf-8")

          for action_name in ("AttributeSwapModule.java", "AutoWitherModule.java", "AutoPearlCatchModule.java"):
              action_file = target / action_name
              if action_file.exists():
                  action_text = action_file.read_text(encoding="utf-8")
                  action_text = re.sub(
                      r"(public void onBindAction\(\)\s*\{\s*)",
                      r"\1if (isEnabled()) { setEnabled(false); return; }\n        setEnabled(true);\n        ",
                      action_text,
                      count=1
                  )
                  action_file.write_text(action_text, encoding="utf-8")

          # Show brief client status notices when the client starts and when a
          # multiplayer connection is joined or closed.
          entrypoint = target / "SusChunkFinderClient.java"
          entry = entrypoint.read_text(encoding="utf-8")
          if "ClientPlayConnectionEvents.JOIN.register" not in entry:
              entry = entry.replace(
                  "import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientLifecycleEvents;",
                  "import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientLifecycleEvents;\nimport net.fabricmc.fabric.api.client.networking.v1.ClientPlayConnectionEvents;"
              )
              entry = entry.replace(
                  "import net.minecraft.resources.Identifier;",
                  "import net.minecraft.resources.Identifier;\nimport net.minecraft.network.chat.Component;"
              )
              init_marker = "\t\tConfig.get();\n"
              notices = (
                  "\t\tClientLifecycleEvents.CLIENT_STARTED.register(client -> "
                  "client.gui.setOverlayMessage(Component.literal(\"ION Client ready\"), false));\n"
                  "\t\tClientPlayConnectionEvents.JOIN.register((handler, sender, client) -> "
                  "client.gui.setOverlayMessage(Component.literal(\"ION Client connected\"), false));\n"
                  "\t\tClientPlayConnectionEvents.DISCONNECT.register((handler, client) -> "
                  "client.gui.setOverlayMessage(Component.literal(\"ION Client disconnected\"), false));\n"
              )
              if init_marker not in entry:
                  raise SystemExit("Could not safely insert ION lifecycle status notices.")
              entry = entry.replace(init_marker, init_marker + notices, 1)
              entrypoint.write_text(entry, encoding="utf-8")

          # Add the thin 3D line primitive used by ION's particle/trajectory effects.
          batch = target / "EspBatch.java"
          batch_text = batch.read_text(encoding="utf-8")
          if "public void line(Vec3 from, Vec3 to," not in batch_text:
              method = """
          	/** Draws a thin, oriented 3D segment using the existing filled-geometry batch. */
          	public void line(Vec3 from, Vec3 to, float r, float g, float bl, float a, double thickness) {
          		Vec3 direction = to.subtract(from);
          		double length = direction.length();
          		if (length < 1.0E-7) return;
          		direction = direction.scale(1.0 / length);
          		Vec3 reference = Math.abs(direction.y) < 0.9 ? new Vec3(0, 1, 0) : new Vec3(1, 0, 0);
          		Vec3 side = direction.cross(reference).normalize().scale(thickness * 0.5);
          		Vec3 up = direction.cross(side).normalize().scale(thickness * 0.5);
          		Vec3 p0 = from.subtract(side).subtract(up);
          		Vec3 p1 = from.add(side).subtract(up);
          		Vec3 p2 = from.add(side).add(up);
          		Vec3 p3 = from.subtract(side).add(up);
          		Vec3 q0 = to.subtract(side).subtract(up);
          		Vec3 q1 = to.add(side).subtract(up);
          		Vec3 q2 = to.add(side).add(up);
          		Vec3 q3 = to.subtract(side).add(up);
          		v(p0.x, p0.y, p0.z, r, g, bl, a); v(p1.x, p1.y, p1.z, r, g, bl, a);
          		v(p2.x, p2.y, p2.z, r, g, bl, a); v(p3.x, p3.y, p3.z, r, g, bl, a);
          		v(q1.x, q1.y, q1.z, r, g, bl, a); v(q0.x, q0.y, q0.z, r, g, bl, a);
          		v(q3.x, q3.y, q3.z, r, g, bl, a); v(q2.x, q2.y, q2.z, r, g, bl, a);
          		v(p0.x, p0.y, p0.z, r, g, bl, a); v(q0.x, q0.y, q0.z, r, g, bl, a);
          		v(q1.x, q1.y, q1.z, r, g, bl, a); v(p1.x, p1.y, p1.z, r, g, bl, a);
          		v(p1.x, p1.y, p1.z, r, g, bl, a); v(q1.x, q1.y, q1.z, r, g, bl, a);
          		v(q2.x, q2.y, q2.z, r, g, bl, a); v(p2.x, p2.y, p2.z, r, g, bl, a);
          		v(p2.x, p2.y, p2.z, r, g, bl, a); v(q2.x, q2.y, q2.z, r, g, bl, a);
          		v(q3.x, q3.y, q3.z, r, g, bl, a); v(p3.x, p3.y, p3.z, r, g, bl, a);
          		v(p3.x, p3.y, p3.z, r, g, bl, a); v(q3.x, q3.y, q3.z, r, g, bl, a);
          		v(q0.x, q0.y, q0.z, r, g, bl, a); v(p0.x, p0.y, p0.z, r, g, bl, a);
          		shapes++;
          	}
          """
              idx = batch_text.rfind("}")
              if idx < 0:
                  raise SystemExit("Cannot safely add line primitive to EspBatch.")
              batch_text = batch_text[:idx] + method + batch_text[idx:]
              batch.write_text(batch_text, encoding="utf-8")

          # 1.21.11 renamed ResourceKey.location() to identifier().
          coordinates = target / "CoordinatesHudModule.java"
          if coordinates.exists():
              src = coordinates.read_text(encoding="utf-8")
              src = src.replace(".dimension().location()", ".dimension().identifier()")
              coordinates.write_text(src, encoding="utf-8")

          # Do not replace the existing GUI, settings screen, config manager,
          # or keybind layer. The base manager's dynamic module iteration makes
          # each new module appear in the same GUI/settings/keybind system.
          forbidden_ion = {"KillAuraModule", "MaceModule", "AutoMaceModule",
                           "ElytraMaceTargetModule", "TriggerBotModule", "StorageEspModule"}
          leaked = sorted(forbidden_ion.intersection(added_modules))
          if leaked:
              raise SystemExit("Forbidden ION modules were selected: " + ", ".join(leaked))
          forbidden_source_names = {"PlayerEspModule", "StorageEspModule", "KillAuraModule", "TriggerBotModule"}
          forbidden_registered = sorted(name for name in forbidden_source_names if re.search(
              r"new\s+" + re.escape(name) + r"\s*\(", text
          ))
          if forbidden_registered:
              raise SystemExit("User-excluded modules are still registered: " + ", ".join(forbidden_registered))
          report = {
              "added_modules": added_modules,
              "added_helpers": copied_helpers,
              "removed_base_modules": removed_base_modules,
              "excluded_ion_modules": sorted(excluded),
              "gui": "original 1.21.11 ClickGuiScreen with ION 1.0.0 visual treatment",
              "keybinds": "base Keys and ModuleKeybinds (Left Shift opens the original GUI)",
              "open_gui_default": "LEFT_SHIFT",
              "settings": "base ModuleSettingsScreen and ModuleManager config",
          }
          import json
          Path("/tmp/ion-module-merge-report.json").write_text(json.dumps(report, indent=2) + "\n")
          print("Added modules:", ", ".join(added_modules))
          print("Added helper sources:", ", ".join(copied_helpers))
          print("Excluded ION modules:", ", ".join(sorted(excluded)))
          print("Preserved original base modules, GUI, settings, config and keybind code.")
          PY

      - name: Build the merged 1.21.11 client source
        working-directory: /tmp/base-source
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(find /tmp/base-source -type f -name build.gradle -printf '%h\n' | head -1)"
          cd "$BASE"
          ./gradlew --no-daemon --stacktrace clean build
          mkdir -p "$GITHUB_WORKSPACE/dist"
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          test -n "$JAR"
          cp "$JAR" "$GITHUB_WORKSPACE/dist/ion-client-modules-1.21.11.jar"

      - name: Merge compiled updates into the complete original 1.21.11 JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, zipfile, subprocess
          from pathlib import Path

          base_path = Path("skbiditoilet-1.0.0.jar")
          built_path = Path("dist/ion-client-modules-1.21.11.jar")
          output = Path("dist/ION-CLIENT-1.21.11-MERGED.jar")
          report = json.loads(Path("/tmp/ion-module-merge-report.json").read_text())

          def is_removed_module_class(entry):
              if not entry.startswith("com/suschunkfinder/") or not entry.endswith(".class"):
                  return False
              simple = entry.rsplit("/", 1)[-1].split("$", 1)[0][:-6].casefold()
              return (
                  simple in {"playerespmodule", "storageespmodule", "killa uramodule".replace(" ", ""),
                             "triggerbotmodule"}
                  or ("mace" in simple and simple.endswith("module"))
              )

          banned = {"PlayerEspModule", "StorageEspModule", "KillAuraModule", "TriggerBotModule"}
          with zipfile.ZipFile(base_path, "r") as original, zipfile.ZipFile(built_path, "r") as built:
              if original.testzip() is not None or built.testzip() is not None:
                  raise SystemExit("The original or rebuilt JAR failed ZIP integrity validation.")

              base_names = set(original.namelist())
              base_meta = json.loads(original.read("fabric.mod.json"))
              json.loads(built.read("fabric.mod.json"))

              if base_meta.get("id") != "suschunkfinder":
                  raise SystemExit(f"Original base mod ID mismatch: {base_meta.get('id')!r}")
              minecraft_dep = base_meta.get("depends", {}).get("minecraft", "")
              if "1.21.11" not in minecraft_dep:
                  raise SystemExit(f"Original base JAR is not marked for Minecraft 1.21.11: {minecraft_dep!r}")
              required_core = {
                  "com/suschunkfinder/ClickGuiScreen.class",
                  "com/suschunkfinder/ModuleSettingsScreen.class",
                  "com/suschunkfinder/ModuleManager.class",
                  "com/suschunkfinder/Keys.class",
                  "com/suschunkfinder/ModuleKeybinds.class",
              }
              missing_core = sorted(required_core - base_names)
              if missing_core:
                  raise SystemExit("Original 1.21.11 JAR is missing core client classes: " + ", ".join(missing_core))

              # Copy every entry from the original client first. This is the
              # preservation guarantee missing from the previous rebuild.
              merged = {}
              for info in original.infolist():
                  if info.is_dir():
                      merged[info.filename] = (info, b"")
                  else:
                      merged[info.filename] = (info, original.read(info.filename))

              overlay_count = 0
              for info in built.infolist():
                  name = info.filename
                  if info.is_dir() or name == "fabric.mod.json" or name.startswith("META-INF/"):
                      continue
                  if name.endswith(".class") or name.startswith(("assets/", "data/")):
                      merged[name] = (info, built.read(name))
                      overlay_count += 1

              # Keep original mod ID, dependencies, entrypoints, mixins and other
              # metadata. Change only the display identity/version.
              final_meta = dict(base_meta)
              final_meta["name"] = "ION CLIENT"
              final_meta["version"] = "1.1.0"
              final_meta["description"] = "ION Client for Minecraft 1.21.11"
              metadata_bytes = (json.dumps(final_meta, indent=2, ensure_ascii=False) + "\n").encode("utf-8")
              merged["fabric.mod.json"] = (None, metadata_bytes)

              removed_entries = sorted(name for name in merged if is_removed_module_class(name))
              for name in removed_entries:
                  del merged[name]

              output.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as result:
                  for name, (info, data) in merged.items():
                      if info is None:
                          result.writestr(name, data)
                      else:
                          result.writestr(info, data)

          with zipfile.ZipFile(output, "r") as check:
              if check.testzip() is not None:
                  raise SystemExit("Final merged JAR failed ZIP integrity validation.")
              entries = set(check.namelist())
              metadata = json.loads(check.read("fabric.mod.json"))
              if metadata.get("id") != base_meta.get("id") or metadata.get("depends") != base_meta.get("depends"):
                  raise SystemExit("Original mod identity or dependency metadata was not preserved.")
              if not required_core.issubset(entries):
                  raise SystemExit("One or more original GUI/settings/keybind core classes are missing.")
              if any(is_removed_module_class(name) for name in entries):
                  raise SystemExit("A user-excluded module class remains in the final JAR.")
              if not any(name.casefold().endswith("/mobespmodule.class") for name in entries):
                  raise SystemExit("Mob ESP was unexpectedly removed.")

              retained_base = base_names - set(removed_entries)
              missing_retained = sorted(retained_base - entries)
              if missing_retained:
                  raise SystemExit("Original JAR entries were lost during merge: " + ", ".join(missing_retained[:30]))

              key_check = subprocess.run(
                  ["javap", "-classpath", str(output), "-c", "-p", "com.suschunkfinder.Keys"],
                  check=True, capture_output=True, text=True
              ).stdout
              if "key.ionclient.open_gui" not in key_check or "sipush        340" not in key_check:
                  raise SystemExit("Compiled GUI key is not the fresh Left Shift mapping.")
              if "key.suschunkfinder.open_gui" in key_check or "sipush         85" in key_check:
                  raise SystemExit("Compiled GUI key still contains the old saved U mapping.")

              manager_check = subprocess.run(
                  ["javap", "-classpath", str(output), "-c", "-p", "com.suschunkfinder.ModuleManager"],
                  check=True, capture_output=True, text=True
              ).stdout
              lingering = sorted(name for name in banned if name in manager_check)
              if lingering:
                  raise SystemExit("Excluded modules remain referenced by ModuleManager: " + ", ".join(lingering))

              language_path = "assets/skbiditoilet/suschunkfinder/lang/en_us.json"
              if language_path in entries:
                  language = json.loads(check.read(language_path))
                  if language.get("key.ionclient.open_gui") != "Open ION Client GUI":
                      raise SystemExit("Final Controls-menu language entry is invalid or missing.")

              print("Original base JAR:", base_path.stat().st_size, "bytes")
              print("Final merged JAR:", output.stat().st_size, "bytes")
              print("Original entries retained:", len(retained_base), "/", len(base_names), "(excluding explicitly removed module classes)")
              print("New/replaced compiled entries overlaid:", overlay_count)
              print("Final class count:", sum(name.endswith(".class") for name in entries))
              print("Removed excluded module class files:", len(removed_entries))
              print("Explicitly removed modules from original source registry:", ", ".join(report.get("removed_base_modules", [])) or "(none found in source registry)")
              print("ION modules added:", len(report["added_modules"]))
              print("Original GUI, settings, keybinds, mod ID, dependencies and all unrelated JAR entries retained.")
              print("Created:", output)
          PY
          sha256sum dist/ION-CLIENT-1.21.11-MERGED.jar

      - name: Upload the single combined JAR
        uses: actions/upload-artifact@v4
        with:
          name: ION-CLIENT-1.21.11-MERGED
          path: dist/ION-CLIENT-1.21.11-MERGED.jar
          if-no-files-found: error
